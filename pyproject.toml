[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-archaeologist"
version = "0.1.0"
description = "Autonomous forensic code intelligence CLI mining git commit history, pull requests, and AST symbol lineages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Avyaan Sharma" }
]

[project.urls]
Homepage = "https://github.com/avyaansharma/archaeologist-cli"
Repository = "https://github.com/avyaansharma/archaeologist-cli"

dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "gitpython>=3.1.59",
    "google-genai>=2.18.1",
    "jsonpatch>=1.33",
    "langchain-anthropic>=1.5.6",
    "langchain-google-genai>=4.3.3",
    "langgraph>=1.2.11",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pygithub>=2.9.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sqlmodel>=0.0.39",
    "sse-starlette>=3.4.8",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "typer>=0.27.1",
    "uvicorn>=0.52.3",
]

[project.scripts]
archaeologist = "archaeologist.cli:app"
arch = "archaeologist.cli:app"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["archaeologist*"]

[tool.setuptools.package-data]
"archaeologist.web" = ["static/*", "static/**/*"]

