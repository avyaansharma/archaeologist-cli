[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-archaeologist"
version = "0.1.0"
description = "Autonomous forensic code intelligence CLI mining git commit history, pull requests, and AST symbol lineages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Avyaan Sharma" }
]

dependencies = [
    "anthropic>=0.122.0",
    "fastembed>=0.8.0",
    "gitpython>=3.1.59",
    "google-genai>=2.18.1",
    "jsonpatch>=1.33",
    "langchain-anthropic>=1.5.6",
    "langchain-google-genai>=4.3.3",
    "langgraph>=1.2.11",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pygithub>=2.9.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sqlmodel>=0.0.39,<0.0.45",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/avyaansharma/archaeologist-cli"
Repository = "https://github.com/avyaansharma/archaeologist-cli"

[project.scripts]
archaeologist = "archaeologist.cli:app"
arch = "archaeologist.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["archaeologist*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "scratch",
    "brag-output",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from
    "E402",  # module level import not at top of file
    "B007",  # loop control variable not used
    "E712",  # comparison to True/False in SQLAlchemy / SQLModel queries
    "B905",  # zip without strict=
    "W293",  # blank line contains whitespace
]


[tool.ruff.lint.isort]
known-first-party = ["archaeologist"]
